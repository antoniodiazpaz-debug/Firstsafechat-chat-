<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SecureChat</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#111b21">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SecureChat">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" href="/icons/32.png">
<style>
/* ═══════════════════════════════════════════════════════════════════════
   DESIGN — WhatsApp-Optik: dunkles Grün/Anthrazit-Theme, wie im
   Referenz-Screenshot (Tab-Leiste "Alle/Ungelesen/Favoriten/Gruppen",
   Kamera-Icon in der Kopfzeile, grüne Ausgangshäkchen, FAB unten rechts).
   ═══════════════════════════════════════════════════════════════════════ */
:root{
  --bg:#0b141a; --panel:#111b21; --panel2:#182229; --inp:#2a3942;
  --mine:#005c4b; --theirs:#202c33; --line:#1f2c33;
  --tx:#e9edef; --sub:#8696a0; --mut:#667781;
  --acc:#00a884; --acc2:#25d366; --dan:#f15c6d; --warn:#f5b544; --info:#53bdeb;
  --tabpill:#0b3d2e;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--tx);font-family:-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px}
button,input,textarea{font-family:inherit;font-size:inherit}
button{cursor:pointer;border:none;background:none;color:inherit}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:#33414a;border-radius:3px}
.hide{display:none!important}
img{max-width:100%}

/* ── App-Shell ── */
#app{height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.topbar{display:flex;align-items:center;gap:6px;padding:14px 16px 10px;flex-shrink:0;background:var(--bg)}
.topbar h1{font-size:28px;font-weight:800;letter-spacing:-.5px;margin:0;flex:1}
.topicons{display:flex;align-items:center;gap:4px}
.iconbtn{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px}
.iconbtn:active{background:rgba(255,255,255,.08)}

/* Suchleiste */
.searchwrap{padding:0 16px 10px}
.search{display:flex;align-items:center;gap:10px;background:var(--panel2);border-radius:24px;padding:9px 16px}
.search input{flex:1;background:none;border:none;color:var(--tx);outline:none}
.search .ic{color:var(--sub);font-size:16px}

/* Filter-Pillen: Alle / Ungelesen / Favoriten / Gruppen */
.pillbar{display:flex;gap:8px;padding:0 16px 12px;overflow-x:auto}
.pill{flex-shrink:0;padding:7px 16px;border-radius:20px;background:var(--panel2);
  color:var(--tx);font-size:14px;font-weight:500;border:1px solid transparent}
.pill.on{background:var(--tabpill);color:var(--acc2);border-color:rgba(37,211,102,.35);font-weight:700}
.pill.plus{width:36px;padding:0;display:flex;align-items:center;justify-content:center;font-size:17px}

/* Gesperrte Chats Zeile */
.lockedrow{display:flex;align-items:center;gap:14px;padding:10px 16px;color:var(--sub)}
.lockedrow .ic{font-size:20px}

/* ── Chat-Liste ── */
#main{flex:1;overflow:hidden;position:relative}
.scroll{height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch}
.row{display:flex;align-items:center;gap:14px;padding:9px 16px;position:relative}
.row:active{background:rgba(255,255,255,.04)}
.av{width:52px;height:52px;border-radius:50%;background:var(--inp);display:flex;align-items:center;
  justify-content:center;font-size:26px;flex-shrink:0;overflow:hidden;position:relative}
.av img{width:100%;height:100%;object-fit:cover}
.av .dot{position:absolute;bottom:0;right:0;width:13px;height:13px;border-radius:50%;border:2.5px solid var(--bg)}
.dot.online{background:var(--acc2)}.dot.away{background:var(--warn)}.dot.offline{background:var(--mut)}
.meta{flex:1;min-width:0;border-bottom:1px solid var(--line);padding-bottom:9px;padding-top:1px}
.row:last-child .meta{border-bottom:none}
.meta .l1{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.meta .nm{font-weight:500;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta .tm{font-size:12px;color:var(--mut);flex-shrink:0}
.meta .tm.un{color:var(--acc2);font-weight:700}
.meta .l2{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:2px}
.meta .pv{font-size:14px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;
  display:flex;align-items:center;gap:4px}
.meta .pv .ck{color:var(--mut);font-size:14px}
.meta .pv .ck.read{color:var(--info)}
.unread{background:var(--acc2);color:#04231a;border-radius:11px;min-width:20px;height:20px;padding:0 6px;
  font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.pin{font-size:13px;color:var(--mut)}
.mutedic{font-size:13px;color:var(--mut)}

.empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:12px;color:var(--mut);padding:40px 24px;text-align:center}
.empty .ic{font-size:56px;opacity:.5}

/* Floating Action Button */
.fab{position:absolute;right:18px;bottom:22px;width:58px;height:58px;border-radius:18px;
  background:var(--acc2);color:#04231a;display:flex;align-items:center;justify-content:center;
  font-size:26px;box-shadow:0 4px 14px rgba(0,0,0,.4)}
.fab:active{transform:scale(.94)}

/* Unterer Tab-Balken: Chats / Aktuelles / Communitys / Anrufe */
#navbar{display:flex;background:var(--bg);border-top:1px solid var(--line);flex-shrink:0;
  padding-bottom:env(safe-area-inset-bottom)}
#navbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;
  padding:9px 0 8px;color:var(--mut);position:relative}
#navbar button.on{color:var(--acc2)}
#navbar .navic{font-size:22px;line-height:1}
#navbar .navlb{font-size:11px;font-weight:500}
#navbar .navbdg{position:absolute;top:4px;right:calc(50% - 26px);width:9px;height:9px;
  border-radius:50%;background:var(--acc2)}

/* ── Login/Registrierung ── */
#auth{height:100dvh;display:flex;align-items:center;justify-content:center;padding:20px;
  background:radial-gradient(1000px 700px at 50% -10%,#0d3226,#0b141a 60%)}
.card{width:100%;max-width:400px;background:var(--panel);border:1px solid var(--line);
  border-radius:20px;padding:32px 24px;box-shadow:0 24px 60px rgba(0,0,0,.55)}
.logo{text-align:center;margin-bottom:24px}
.logo .ic{font-size:52px}
.logo h1{margin:8px 0 2px;font-size:27px;letter-spacing:-.5px}
.logo p{margin:0;color:var(--sub);font-size:12.5px}
.seg{display:flex;background:var(--inp);border-radius:12px;padding:3px;margin-bottom:20px}
.seg button{flex:1;padding:10px 0;border-radius:9px;font-weight:600;color:var(--sub);transition:.2s}
.seg button.on{background:var(--acc);color:#fff}
label{display:block;font-size:12px;color:var(--sub);margin:0 0 6px;font-weight:500}
.in{width:100%;background:var(--inp);border:1.5px solid transparent;border-radius:11px;
  padding:12px 14px;color:var(--tx);outline:none;margin-bottom:14px;transition:.2s}
.in:focus{border-color:var(--acc)}
.btn{width:100%;background:var(--acc);color:#fff;border-radius:11px;padding:13px 0;
  font-weight:700;font-size:16px;transition:.15s}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.55}
.btn.ghost{background:var(--inp);color:var(--tx)}
.btn.dan{background:rgba(241,92,109,.14);color:var(--dan);border:1px solid var(--dan)}
.err{background:#3a1a1e;border:1px solid #5c2630;color:#ff8a95;border-radius:9px;
  padding:10px 12px;font-size:13px;margin-bottom:14px}
.enc{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:16px;
  color:var(--mut);font-size:11.5px;text-align:center}

/* ── Chat-Fenster ── */
.chatview{position:fixed;inset:0;background:var(--bg);z-index:100;display:flex;flex-direction:column}
.chatbar{display:flex;align-items:center;gap:10px;padding:10px 8px;background:var(--panel);
  border-bottom:1px solid var(--line);flex-shrink:0;padding-top:calc(10px + env(safe-area-inset-top))}
.chatbar .name{flex:1;min-width:0}
.chatbar .nm{font-size:16.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chatbar .st{font-size:12px;color:var(--sub)}
#chatbody{flex:1;overflow-y:auto;padding:10px 10px 4px;
  background-image:radial-gradient(circle at 20% 30%,rgba(0,168,132,.04),transparent 40%)}
.daysep{text-align:center;margin:14px 0 8px}
.daysep span{background:var(--panel2);color:var(--sub);font-size:11.5px;padding:4px 12px;border-radius:12px}
.msgrow{display:flex;align-items:flex-end;gap:6px;margin-bottom:3px}
.msgrow.mine{flex-direction:row-reverse}
.bub{max-width:78%;background:var(--theirs);border-radius:4px 14px 14px 14px;padding:7px 10px 5px;
  box-shadow:0 1px 1px rgba(0,0,0,.25)}
.msgrow.mine .bub{background:var(--mine);border-radius:14px 4px 14px 14px}
.bub .tx{font-size:15px;line-height:1.45;word-break:break-word;white-space:pre-wrap}
.bub .ft{display:flex;align-items:center;gap:4px;justify-content:flex-end;margin-top:2px}
.bub .tm{font-size:10.5px;color:rgba(233,237,239,.55)}
.bub .ck{font-size:11px;color:rgba(233,237,239,.55)}.bub .ck.read{color:var(--info)}
.bub .media{border-radius:10px;overflow:hidden;margin:-2px -4px 4px}
.bub .media img,.bub .media video{display:block;width:100%;max-height:320px;object-fit:cover}
.bub .filemsg{display:flex;align-items:center;gap:9px;background:rgba(0,0,0,.2);border-radius:9px;padding:8px 10px}
.encnote{display:flex;align-items:center;gap:6px;background:rgba(0,168,132,.09);border:1px solid rgba(0,168,132,.18);
  border-radius:12px;padding:7px 13px;margin:6px auto 12px;width:fit-content;max-width:92%;
  color:var(--sub);font-size:11px;text-align:center}
#composer{flex-shrink:0;background:var(--panel);border-top:1px solid var(--line);
  padding:8px 10px calc(8px + env(safe-area-inset-bottom))}
.cbar{display:flex;align-items:flex-end;gap:7px}
.cin{flex:1;display:flex;align-items:flex-end;gap:6px;background:var(--inp);border-radius:22px;padding:5px 6px 5px 14px}
.cin textarea{flex:1;background:none;border:none;color:var(--tx);outline:none;resize:none;max-height:110px;
  line-height:1.45;padding:9px 0}
.sendbtn{width:44px;height:44px;border-radius:50%;background:var(--acc2);color:#04231a;font-size:19px;
  display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sendbtn:active{transform:scale(.92)}

/* ── Sheets/Modals ── */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:200;display:flex;align-items:flex-end}
.sheetbox{width:100%;background:var(--panel);border-radius:20px 20px 0 0;
  padding:16px 16px calc(24px + env(safe-area-inset-bottom))}
.grabber{width:38px;height:4px;background:var(--inp);border-radius:2px;margin:0 auto 14px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:300;display:flex;align-items:center;
  justify-content:center;padding:18px}
.modalbox{width:100%;max-width:400px;max-height:84vh;overflow-y:auto;background:var(--panel);
  border:1px solid var(--line);border-radius:17px;padding:22px}
.modalbox h3{margin:0 0 14px;font-size:18px}
.mrow{display:flex;gap:9px;margin-top:16px}.mrow .btn{flex:1}
.toast{position:fixed;bottom:88px;left:50%;transform:translateX(-50%);background:#263238;color:#fff;
  padding:11px 18px;border-radius:22px;font-size:13.5px;z-index:700;box-shadow:0 8px 24px rgba(0,0,0,.5);
  max-width:88vw;text-align:center}

#boot{height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  background:var(--bg);padding:24px;text-align:center}
#boot .ic{font-size:50px;animation:spin 2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#boot .s{color:var(--sub);font-size:13px;max-width:280px}
</style>
</head>
<body>

<div id="boot">
  <div class="ic">🔐</div>
  <div class="s" id="bootMsg">Verbindung wird hergestellt…</div>
</div>

<div id="auth" class="hide"></div>
<div id="app" class="hide"></div>
<div id="overlays"></div>

<script type="module" src="/app.js"></script>
<script>
window.addEventListener('error', e => {
  const info = [
    'FEHLER: ' + e.message,
    'Datei: ' + (e.filename||'?'),
    'Zeile: ' + e.lineno + ', Spalte: ' + e.colno,
    '',
    'Stack:',
    (e.error?.stack || '(kein Stack)')
  ].join('\n');
  document.body.innerHTML = '<div style="position:fixed;inset:0;background:#000;color:#f00;font-family:monospace;font-size:12px;padding:16px;overflow:auto;white-space:pre-wrap;z-index:99999;user-select:text;-webkit-user-select:text">' + info + '</div>';
});
window.addEventListener('unhandledrejection', e => {
  const info = 'PROMISE FEHLER:\n' + (e.reason?.stack || String(e.reason));
  document.body.innerHTML = '<div style="position:fixed;inset:0;background:#000;color:#ff0;font-family:monospace;font-size:12px;padding:16px;overflow:auto;white-space:pre-wrap;z-index:99999;user-select:text;-webkit-user-select:text">' + info + '</div>';
});
</script>
</body>
</html>
